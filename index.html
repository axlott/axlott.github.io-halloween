<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Party — You're Invited!</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff7518;--purple:#8b35b8;--ink:#0b0716;--cream:#fff9f0}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 50% 35%,#251137 0%,#0b0716 70%);color:#f8f3ff;font-family:Montserrat,sans-serif;min-height:220vh;overflow-x:hidden}
.scene{position:fixed;inset:0;display:grid;place-items:center;padding:12px;perspective:1200px;z-index:2}
.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient-star{position:absolute;color:#ff9b42;opacity:.5;animation:twinkle 2.8s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.12;transform:scale(.65) rotate(25deg)}}
/* The card follows the supplied invitation image's proportions. */
.card{position:relative;width:min(880px,94vw);aspect-ratio:1024 / 732;height:auto;max-height:82vh;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.75,.2,1);cursor:pointer;z-index:3;box-shadow:0 18px 35px #0008;border-radius:18px;outline:none}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:0;border:0;transform-style:preserve-3d}
.front{transform:rotateY(0deg);z-index:2}
.back{transform:rotateY(180deg);z-index:1}
.front{background:#fff;display:block}
.front img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
/* No extra title, caption, frame, or padding on the image-only front. */
.front::after{content:none;display:none}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#29113b,#10091c 68%,#35133b);border:2px solid var(--orange);border-radius:18px;padding:clamp(16px,3vw,34px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(8px,1.7vh,16px);overflow-y:auto}
.kicker{font-family:Creepster,cursive;color:var(--orange);font-size:clamp(1.15rem,3vw,2rem);letter-spacing:2px;text-shadow:0 0 18px #ff751855}
h1{font-family:Creepster,cursive;font-size:clamp(2rem,5vw,3.7rem);line-height:.95;color:#fff;text-shadow:3px 4px 0 #7b2cbf,0 0 20px #a333ed55}
.details{width:min(540px,100%);display:grid;gap:clamp(7px,1.2vh,12px);background:#0005;border:1px solid #ff75184d;border-radius:14px;padding:clamp(10px,2vw,20px)}
.detail{display:grid;gap:3px}.label{font-size:clamp(.6rem,1.5vw,.72rem);letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:#ff9b42}.value{font-size:clamp(.82rem,2vw,1.12rem);line-height:1.35;font-weight:600}.address{color:#f8f3ff;text-decoration:underline;text-decoration-color:#ff7518;text-underline-offset:4px;overflow-wrap:anywhere}.address:hover{color:#ffb06e}
.costume{color:#ffd3a7;font-weight:800}.map-btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;background:linear-gradient(45deg,#ff7518,#d94e07);color:white;text-decoration:none;border-radius:30px;padding:10px 19px;font-size:clamp(.78rem,1.8vw,1rem);font-weight:800;letter-spacing:.04em;box-shadow:0 7px 22px #ff75183d;transition:transform .2s,box-shadow .2s;flex-shrink:0}.map-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px #ff751866}
.hint{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:4;color:#ff9b42;font-family:Creepster,cursive;font-size:clamp(1rem,4vw,1.35rem);letter-spacing:1px;text-shadow:0 0 12px #ff751855;white-space:nowrap;pointer-events:none;transition:opacity .25s}.scroll-space{height:220vh}
.bat-swarm{position:fixed;inset:0;z-index:20;overflow:hidden;pointer-events:none}.flying-bat{position:absolute;width:clamp(30px,6vw,76px);height:clamp(30px,6vw,76px);object-fit:contain;will-change:transform,opacity;animation:batFlight var(--duration,2.8s) cubic-bezier(.2,.65,.4,1) forwards;filter:drop-shadow(0 2px 4px #ff751855)}
@keyframes batFlight{0%{transform:translate(0,0) rotate(var(--rot,0deg)) scale(.55);opacity:0}8%{opacity:1}35%{transform:translate(var(--dx1),var(--dy1)) rotate(calc(var(--rot,0deg) + 18deg)) scale(1.05)}70%{transform:translate(var(--dx2),var(--dy2)) rotate(calc(var(--rot,0deg) - 22deg)) scale(.9)}100%{transform:translate(var(--dx3),var(--dy3)) rotate(calc(var(--rot,0deg) + 35deg)) scale(.45);opacity:0}}
@media(max-width:600px){
 .scene{padding:10px}
 .card{width:94vw;max-height:76vh;aspect-ratio:1024 / 732}
 .card-face{border-radius:12px}
 .front img{width:100%;height:100%;object-fit:contain}
 .back{padding:12px 10px;gap:7px;border-radius:12px}
 .kicker{font-size:1.15rem;letter-spacing:1px}
 h1{font-size:clamp(1.8rem,8vw,2.4rem)}
 .details{padding:9px 8px;gap:6px;border-radius:10px}
 .label{font-size:.58rem;letter-spacing:.12em}
 .value{font-size:clamp(.78rem,3.4vw,.94rem);line-height:1.25}
 .map-btn{font-size:.76rem;padding:8px 13px}
 .hint{bottom:max(10px,env(safe-area-inset-bottom));font-size:1rem}
}
@media(max-height:650px) and (min-width:601px){.card{max-height:72vh}.back{gap:7px;padding:12px}.details{padding:10px;gap:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head>

let flipped=false, lastScroll=window.scrollY, lastBurst=0;
// Small ambient sparkles keep the background alive without stealing clicks.
for(let i=0;i<22;i++){const s=document.createElement('span');s.className='ambient-star';s.textContent=['✦','✧','·'][i%3];s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(10+Math.random()*20)+'px';s.style.animationDelay=(Math.random()*3)+'s';ambient.appendChild(s)}
function setFlip(next){flipped=next;card.style.transform=flipped?'rotateY(180deg)':'rotateY(0deg)';hint.style.opacity=flipped?'0':'1'}
function toggleFlip(){setFlip(!flipped);releaseBats(20)}
card.addEventListener('click',e=>{if(e.target.closest('a'))return;toggleFlip()});
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFlip()}});
function releaseBats(count=12, originX=window.innerWidth/2, originY=window.innerHeight/2){
 const now=performance.now(); if(now-lastBurst<100)return; lastBurst=now;
 const n=Math.min(count,32);
 for(let i=0;i<n;i++){
  const bat=document.createElement('img');bat.className='flying-bat';bat.src=batSrc;bat.alt='';
  const x=originX+(Math.random()-.5)*150, y=originY+(Math.random()-.5)*100;
  bat.style.left=x+'px';bat.style.top=y+'px';
  bat.style.setProperty('--duration',(2.0+Math.random()*2.2)+'s');
  bat.style.setProperty('--rot',((Math.random()-.5)*50)+'deg');
  bat.style.setProperty('--dx1',((Math.random()-.5)*window.innerWidth*.55)+'px');
  bat.style.setProperty('--dy1',((Math.random()-.5)*window.innerHeight*.5)+'px');
  bat.style.setProperty('--dx2',((Math.random()-.5)*window.innerWidth*.9)+'px');
  bat.style.setProperty('--dy2',((Math.random()-.5)*window.innerHeight*.9)+'px');
  bat.style.setProperty('--dx3',((Math.random()-.5)*window.innerWidth*1.7)+'px');
  bat.style.setProperty('--dy3',((Math.random()-.5)*window.innerHeight*1.7)+'px');
  swarm.appendChild(bat);bat.addEventListener('animationend',()=>bat.remove(),{once:true});
 }
}
window.addEventListener('scroll',()=>{
 const delta=window.scrollY-lastScroll;lastScroll=window.scrollY;
 const maxScroll=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);
 const fraction=Math.min(Math.max(window.scrollY/(maxScroll*.58),0),1);
 // Keep scroll-driven flipping, while allowing a click to flip instantly.
 if(Math.abs(delta)>0){setFlip(fraction>.48);releaseBats(Math.min(18,8+Math.ceil(Math.abs(delta)/12)),Math.random()*window.innerWidth,delta>0?window.innerHeight*.85:window.innerHeight*.15)}
},{passive:true});
window.addEventListener('pointerdown',e=>{if(!e.target.closest('.card')&&!e.target.closest('a'))releaseBats(12,e.clientX,e.clientY)});
</script>
